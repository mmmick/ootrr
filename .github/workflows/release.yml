name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      nightly:
        type: string
        default: ""
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OOTRR_NIGHTLY: ${{ inputs.nightly }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ -n "$OOTRR_NIGHTLY" ]; then
            echo "version=$OOTRR_NIGHTLY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if [ ! -s "CHANGELOG-$version.md" ]; then
            echo "CHANGELOG-$version.md is missing: write the release notes before tagging v$version" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nightly version
        if: env.OOTRR_NIGHTLY != ''
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -I tools/nightly_version.py set "$OOTRR_NIGHTLY"
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --workspace --profile ci

  windows:
    needs: [version, test]
    runs-on: windows-latest
    env:
      OOTRR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Nightly version
        if: env.OOTRR_NIGHTLY != ''
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -I tools/nightly_version.py set "$OOTRR_NIGHTLY"
      - run: rustup toolchain install stable --profile minimal
      - name: Build
        shell: pwsh
        run: |
          $flags = @("--remap-path-prefix=$env:USERPROFILE=user", "--remap-path-prefix=$env:GITHUB_WORKSPACE=ootrr", "-C", "link-arg=/PDBALTPATH:%_PDB%")
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]0x1f
          cargo build --release --locked
      - name: Audit
        run: python -I tools/audit.py target/release/ootrr.exe
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\ootrr.iss
      - name: Check the exe details
        shell: pwsh
        run: |
          $v = (Get-Item target\release\ootrr.exe).VersionInfo
          if ($v.ProductName -ne "OOTRR" -or $v.ProductVersion -ne $env:OOTRR_VERSION) {
            throw "ootrr.exe has no version info (ProductName '$($v.ProductName)', ProductVersion '$($v.ProductVersion)'): rc.exe did not run"
          }
          $b = [IO.File]::ReadAllText((Resolve-Path target\release\ootrr.exe), [Text.Encoding]::ASCII)
          foreach ($s in "EncodedCommand", "ExecutionPolicy", "powershell") {
            if ($b.IndexOf($s, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "ootrr.exe contains '$s', which antivirus tools flag" }
          }
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "OOTRR-$env:OOTRR_VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force "release\$name" | Out-Null
          Copy-Item target\release\ootrr.exe, LICENSE, NOTICE, README.md, packaging\windows\portable.txt "release\$name"
          Compress-Archive -Path "release\$name" -DestinationPath "release\$name.zip" -Force
          Remove-Item -Recurse -Force "release\$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      OOTRR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Nightly version
        if: env.OOTRR_NIGHTLY != ''
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -I tools/nightly_version.py set "$OOTRR_NIGHTLY"
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=ootrr --remap-path-prefix=$HOME=user"
          cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Audit
        run: python3 -I tools/audit.py target/x86_64-unknown-linux-musl/release/ootrr
      - name: Package
        run: |
          chmod +x packaging/linux/build_release.sh packaging/linux/install.sh
          packaging/linux/build_release.sh "$OOTRR_VERSION" target/x86_64-unknown-linux-musl/release/ootrr release
      - name: Check the installer script
        run: |
          sh -n packaging/linux/install.sh
          tmp="$(mktemp -d)"
          tar -xzf release/OOTRR-$OOTRR_VERSION-linux-x86_64.tar.gz -C "$tmp"
          "$tmp"/ootrr-$OOTRR_VERSION-linux-x86_64/install.sh --prefix "$tmp/prefix" --yes
          "$tmp/prefix/bin/ootrr" help > /dev/null
          "$tmp"/ootrr-$OOTRR_VERSION-linux-x86_64/install.sh --prefix "$tmp/prefix" --uninstall
          dpkg-deb --info release/OOTRR-$OOTRR_VERSION-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.tar.gz
            release/*.deb
          if-no-files-found: error

  macos:
    needs: [version, test]
    runs-on: macos-latest
    env:
      OOTRR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Nightly version
        if: env.OOTRR_NIGHTLY != ''
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -I tools/nightly_version.py set "$OOTRR_NIGHTLY"
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=ootrr --remap-path-prefix=$HOME=user"
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/ootrr \
            target/aarch64-apple-darwin/release/ootrr \
            target/x86_64-apple-darwin/release/ootrr
      - name: Audit
        run: python3 -I tools/audit.py target/universal/ootrr
      - name: Package
        run: |
          chmod +x packaging/macos/build_pkg.sh
          packaging/macos/build_pkg.sh "$OOTRR_VERSION" target/universal/ootrr release
          pkgutil --check-signature release/OOTRR-$OOTRR_VERSION-macos-universal.pkg || true
          pkgutil --payload-files release/OOTRR-$OOTRR_VERSION-macos-universal.pkg | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.pkg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.nightly == ''
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build attestations: a signed record, kept by GitHub, that each
      # file was built by this workflow from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.pkg
            dist/*.deb
            dist/*.tar.gz
      - name: Notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            cat "CHANGELOG-$VERSION.md"
            echo
            echo "## Downloads"
            echo
            echo "No game files, keys or dumps are included. You need your own extracted game files."
            echo
            echo "Windows: run the setup exe, or unpack the portable zip anywhere and double-click ootrr.exe (nothing is installed: delete the folder to remove it). macOS: open the pkg. Linux: use the deb, or unpack the tar.gz and run install.sh."
            echo
            echo "The files are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper may warn you the first time. Every file is built by GitHub Actions from the tagged source and has a build attestation. To check that a file came from this repository's release workflow, run: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo
            echo "Check SHA256SUMS.txt to verify a download."
          } > "$RUNNER_TEMP/notes.md"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "OOTRR ${{ needs.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease=false \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OOTRR ${{ needs.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
