<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>OOTRR Available now</title>
<link rel="stylesheet" href="/now.css">

<body>
<header class="top">
<h1>Available now</h1>
<div id="live" class="chip" role="status" aria-live="polite">Starting</div>
<div id="count" class="count"></div>
<div id="last" class="last grow" role="status" aria-live="polite"></div>
<label class="opt"><input id="locked" type="checkbox"> Locked</label>
<label class="opt"><input id="done" type="checkbox"> Checked</label>
<a class="link" href="/tracker">Full tracker</a>
</header>
<div id="spoiler" class="spoiler"></div>
<main id="areas" class="areas"></main>

</body>
